name: dpdf
description: >-
  Pure Dart PDF library: creation, reading, editing, text layout,
  HTML conversion, forms, digital signatures and PDF/A conformance.
version: 1.0.0
repository: https://github.com/insinfo/dpdf
issue_tracker: https://github.com/insinfo/dpdf/issues
documentation: https://github.com/insinfo/dpdf#readme

topics:
  - pdf
  - pdf-generation
  - digital-signature
  - html-to-pdf

environment:
  sdk: ^3.6.0

dependencies:
  # HTML5 parser, MIT licensed; used only to build a DOM for HTML-to-PDF.
  html: ^0.15.7
  # Bi-level image codec, Apache-2.0; used to recompress scanned pages.
  jbig2: ^1.0.0
  # JPEG 2000 codec, MIT; used to recompress continuous-tone images.
  j2k: ^1.0.0
  # 2D rasterizer, used to render a PDF page to pixels. Only its web-safe
  # `package:dgfx/dgfx.dart` entry point is imported.
  dgfx: ^1.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.26.3
  # Independent test oracle; never imported by the runtime library.
  crypto: ^3.0.7
  pointycastle: ^4.0.0
