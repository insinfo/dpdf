include: package:lints/recommended.yaml

linter:
  rules:
    # The kernel, io and barcode layers mirror the PDF, OpenType and GS1
    # specifications, where SCREAMING_CAPS names are part of the published
    # vocabulary (TIMES_ROMAN, GUARD_EAN13, ...). Renaming them would hide the
    # correspondence a reader checks against the spec.
    constant_identifier_names: false
    non_constant_identifier_names: false

    # A discarded Future is how `Document.add()` used to lose a paragraph: no
    # error, no warning, nothing on the page. These two rules are what makes
    # the next one of those fail the build instead of the document.
    discarded_futures: true
    unawaited_futures: true
