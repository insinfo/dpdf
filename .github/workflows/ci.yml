name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Dart ${{ matrix.sdk }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        sdk: ['3.6', stable]

    steps:
      # `dependency_overrides` aponta para `../jbig2`, `../dgfx` e
      # `../jpeg2000`, então os quatro precisam estar lado a lado. Enquanto
      # esses três não estiverem no pub.dev, o CI resolve pelo código-fonte do
      # próprio GitHub — o que também detecta quando uma mudança lá quebra o
      # dpdf.
      - uses: actions/checkout@v4
        with:
          path: dpdf

      - uses: actions/checkout@v4
        with:
          repository: insinfo/jbig2
          path: jbig2

      - uses: actions/checkout@v4
        with:
          repository: insinfo/dgfx
          path: dgfx

      - uses: actions/checkout@v4
        with:
          repository: insinfo/jpeg2000
          path: jpeg2000

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Resolver dependências
        working-directory: dpdf
        run: dart pub get

      # So no SDK fixo: o formatador muda entre versoes do Dart, e numa matriz
      # com 3.6 e `stable` nao existe formatacao que passe nos dois. Fingir o
      # contrario deixaria o portao vermelho para sempre.
      - name: Verificar formatação
        if: matrix.sdk == '3.6'
        working-directory: dpdf
        run: dart format --output=none --set-exit-if-changed lib test example

      # Sem `--fatal-infos` por enquanto: restam 74 avisos informativos
      # (`use_super_parameters` e afins). Erros e warnings reprovam.
      - name: Analisar
        working-directory: dpdf
        run: dart analyze

      - name: Testar
        working-directory: dpdf
        run: dart test --reporter=github -j4

      # A documentação é parte da entrega: um comentário que não resolve uma
      # referência vira link morto na página do pub.dev.
      - name: Gerar documentação
        working-directory: dpdf
        run: dart doc --validate-links

      # Pega cedo o que só apareceria na hora de publicar: arquivo grande
      # demais, licença ausente, recurso que o `.pubignore` deixou de fora.
      # O aviso de `dependency_overrides` é esperado enquanto os três
      # dependentes não estiverem publicados.
      - name: Conferir o empacotamento
        working-directory: dpdf
        run: dart pub publish --dry-run || true
