name: dpdf
description: >-
  Biblioteca PDF pura em Dart: criação, leitura, edição, layout de texto,
  conversão de HTML, formulários, assinatura digital e conformidade PDF/A.
version: 1.0.0
repository: https://github.com/insinfo/dpdf
issue_tracker: https://github.com/insinfo/dpdf/issues
documentation: https://github.com/insinfo/dpdf#readme

topics:
  - pdf
  - pdf-generation
  - digital-signature
  - html-to-pdf

environment:
  sdk: ^3.6.0

dependencies:
  # HTML5 parser, MIT licensed; used only to build a DOM for HTML-to-PDF.
  html: ^0.15.7
  # Bi-level image codec, Apache-2.0; used to recompress scanned pages.
  jbig2: ^1.0.0
  # JPEG 2000 codec, MIT; used to recompress continuous-tone images.
  j2k: ^0.9.0
  # 2D rasterizer, used to render a PDF page to pixels. Only its web-safe
  # `package:dgfx/dgfx.dart` entry point is imported.
  dgfx: ^1.0.0

# jbig2 and dgfx are not on pub.dev yet. Remove this block once they are
# published, or the publish of this package will be rejected.
#
# j2k IS published, but 0.9.0 carries two defects fixed only in the local
# checkout: every 8-bit non-RGB decode breaks under dart2js, and a raw
# codestream with subsampled components is refused -- which is the common
# /JPXDecode case, because PDF embeds the codestream without a JP2 wrapper.
# Drop the j2k entry once a release carrying those fixes is on pub.dev.
dependency_overrides:
  jbig2:
    path: ../jbig2 #https://github.com/insinfo/jbig2.git
  dgfx:
    path: ../dgfx #https://github.com/insinfo/dgfx.git
  j2k:
    path: ../jpeg2000 #https://github.com/insinfo/jpeg2000.git

dev_dependencies:
  lints: ^5.0.0
  test: ^1.26.3
  # Independent test oracle; never imported by the runtime library.
  crypto: ^3.0.7
  pointycastle: ^4.0.0
